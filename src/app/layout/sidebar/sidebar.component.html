<aside
  class="sidebar"
  [class.sidebar--collapsed]="collapsed()"
  [class.sidebar--mobile-open]="mobileOpen()"
  aria-label="기본 메뉴"
>
  <div class="sidebar__brand">
    <a
      class="brand"
      routerLink="/overview"
      aria-label="AI Ops Center 홈"
      (click)="navigationSelect.emit()"
    >
      <span class="brand__mark" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </span>
      <strong class="brand__name">AI Ops Center</strong>
    </a>

    <button
      type="button"
      class="sidebar__collapse"
      [attr.aria-label]="collapsed() ? '사이드바 펼치기' : '사이드바 접기'"
      [title]="collapsed() ? '사이드바 펼치기' : '사이드바 접기'"
      (click)="collapseToggle.emit()"
    >
      <app-icon
        name="collapse"
        [size]="15"
        [class.icon--flipped]="collapsed()"
      />
    </button>
  </div>

  <nav class="sidebar__nav" aria-label="메인 메뉴">
    @for (group of groups; track group.label) {
      <section class="nav-group" [attr.aria-labelledby]="'nav-' + $index">
        <h2 class="nav-group__label" [id]="'nav-' + $index">
          {{ group.label }}
        </h2>

        <ul class="nav-group__list">
          @for (item of group.items; track item.path) {
            <li>
              <a
                class="nav-item"
                [routerLink]="item.path"
                routerLinkActive="nav-item--active"
                [routerLinkActiveOptions]="{
                  paths: 'subset',
                  queryParams: 'ignored',
                  matrixParams: 'ignored',
                  fragment: 'ignored'
                }"
                [attr.title]="collapsed() ? item.label : null"
                (click)="navigationSelect.emit()"
              >
                <app-icon [name]="item.icon" [size]="16" />
                <span class="nav-item__label">{{ item.label }}</span>
              </a>
            </li>
          }
        </ul>
      </section>
    }
  </nav>
</aside>
